server {
    listen 80;
    server_name localhost;
    server_tokens off;  # SEC-004: do not advertise the nginx version

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Hashed build assets never change: cache them for a long time.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA routes (/dashboard, /admin, ...) fall back to index.html, which is never cached.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # API requests go to the Spring Boot backend on the Docker network (same origin for the browser).
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        # $http_host keeps the port (e.g. 127.0.0.1:5173), so the backend sees the browser's Origin as
        # same-origin and does not reject it as a cross-origin request, whatever host name is used.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
