spring:
  application:
    name: nextrisk-backend
  # Optional: lets `mvn spring-boot:run` from backend/ read the repo-root .env (KEY=value lines).
  # Real environment variables always work too. Ignored when the file does not exist (e.g. in Docker).
  config:
    import: optional:file:../.env[.properties]
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:nextrisk}?${DB_JDBC_OPTIONS:useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway migrations, never by Hibernate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    deserialization:
      # Unknown JSON fields (e.g. a client-supplied "roles") are rejected, not silently ignored.
      fail-on-unknown-properties: true

server:
  port: 8080
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}

logging:
  level:
    root: INFO
    com.nextrisk: INFO

nextrisk:
  security:
    bcrypt-strength: 12
    jwt:
      secret: ${JWT_SECRET}            # required, >= 32 chars; app fails to start without it
      issuer: ${JWT_ISSUER:nextrisk-api}
      audience: ${JWT_AUDIENCE:nextrisk-web}
      access-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:15}
    refresh:
      remember-ttl-days: ${REFRESH_REMEMBER_TTL_DAYS:30}
      session-ttl-hours: ${REFRESH_SESSION_TTL_HOURS:12}
      cookie-secure: ${REFRESH_COOKIE_SECURE:true}
      cookie-name: nr_refresh
      cookie-path: /api/auth
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
    bootstrap-admin:
      email: ${BOOTSTRAP_ADMIN_EMAIL:}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:}
      full-name: ${BOOTSTRAP_ADMIN_NAME:Platform Administrator}
